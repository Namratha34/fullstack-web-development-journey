<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Div Example</title>

    <style>
        #outer {
            font-size: 25px;
            border: 2px solid black;
            padding: 20px;
        }

        #inner {
            font-size: 10px;
            border: 2px solid blue;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="outer">
        Outer
        <div id="inner">
            Inner
        </div>
    </div>

</body>
</html>
