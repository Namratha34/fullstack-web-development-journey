5. Create two boxes with different box-sizing values and observe changes in box model.

<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing</title>
    <style>
        .box1{
            width: 200px;
            height: 200px;
            padding: 20px;
            border: 5px solid black;
            background-color: lightblue;
            box-sizing: content-box;
            margin-bottom: 20px;
        }

        .box2{
            width: 200px;
            height: 200px;
            padding: 20px;
            border: 5px solid black;
            background-color: lightcoral;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="box1">Content Box</div>

<div class="box2">Border Box</div>

</body>
</html>
