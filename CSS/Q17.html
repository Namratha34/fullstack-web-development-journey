4. Add dotted border with color red and so much that the button becomes a circle.


<!DOCTYPE html>
<html>
<head>
    <title>Circle Button</title>
    <style>
        button{
            width: 100px;
            height: 100px;
            border: 5px dotted red;
            border-radius: 50%;
            background-color: lightgreen;
        }
    </style>
</head>
<body>

<button>OK</button>

</body>
</html>
